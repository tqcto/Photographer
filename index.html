<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- viewport options -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone Image Processor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Photographer</h2>
  
  <label class="input-btn">
    画像を選択 / 撮影
    <!-- <input type="file" id="upload" accept="image/*" oninput="loadImage()"> -->
     <input type="file" id="upload" accept="image/*">
  </label>

  <div>
    <!-- result image -->
    <img id="result-image" alt="処理結果がここに表示されます">
  </div>

  <!-- for processing -->
  <canvas id="proc-image" style="display:none;"></canvas>
</div>

<script type="text/javascript" src="index.js"></script>
</body>
</html>
