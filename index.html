<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- viewport options -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone Image Processor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h2>Photographer</h2>
    <label class="input-btn">
      画像を選択
      <input type="file" id="upload" accept="image/*">
    </label>
    <button id="saveButton" class="save-btn">保存</button>
  </header>

  <main class="app-main">
    <img id="result-image">
  </main>

  <div class="sub-tools" id="subTools">
    <div class="sub-content" id="subContent">
      ツール選択
    </div>
  </div>

  <nav class="app-toolbar">
    <button class="tool-btn active" data-tool="filter">
      <span class="icon"></span>
      <span class="label">フィルター</span>
    </button>
    <button class="tool-btn" data-tool="adjust">
      <span class="icon"></span>
      <span class="label">調整</span>
    </button>
    <button class="tool-btn" data-tool="crop">
      <span class="icon"></span>
      <span class="label">切り取り</span>
    </button>
  </nav>

  <!-- for processing -->
  <canvas id="proc-image" style="display:none;"></canvas>

<script type="text/javascript" src="index.js"></script>
</body>
</html>
